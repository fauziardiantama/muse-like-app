name: Build Android APK (Release arm64-v8a)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure arm64-v8a architecture filter
        run: |
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
          cat android/gradle.properties | grep "reactNativeArchitectures"

      - name: Ensure Release build uses debug signing config
        run: |
          # Guarantee assembleRelease signs the APK with debug keystore for easy installation
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          # Ensure signingConfig is set in release block
          awk '/buildTypes[[:space:]]*\{/ {in_bt=1} in_bt && /release[[:space:]]*\{/ {print; print "            signingConfig signingConfigs.debug"; next} {print}' android/app/build.gradle > android/app/build.gradle.tmp && mv android/app/build.gradle.tmp android/app/build.gradle
          grep -A 8 "buildTypes {" android/app/build.gradle || true

      - name: Build optimized Release APK (arm64-v8a)
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Locate and prepare release APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found in android/app/build/outputs/apk/release!"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          mkdir -p output
          cp "$APK" output/app-release-arm64.apk
          echo "Final APK Size:"
          ls -lh output/app-release-arm64.apk

      - name: Verify APK contains bundle and fonts
        run: |
          unzip -l output/app-release-arm64.apk | grep "assets/" || true
          unzip -l output/app-release-arm64.apk | grep -q "assets/index.android.bundle" || (echo "ERROR: index.android.bundle NOT in APK" && exit 1)
          unzip -l output/app-release-arm64.apk | grep -iE "\.ttf" || (echo "ERROR: fonts NOT in APK" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-like-app-release-arm64
          path: output/app-release-arm64.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${{ github.run_number }}" output/app-release-arm64.apk \
            --title "Preview build ${{ github.run_number }} (arm64-v8a)" \
            --notes "Optimized Release APK for arm64-v8a (stripped C++ symbols, ABI filtered) built by GitHub Actions." \
            --prerelease
