name: Build Android APK (Release arm64-v8a)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Ensure custom fonts are copied into Android assets (Dual Safeguard)
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp assets/fonts/*.ttf android/app/src/main/assets/fonts/
          # Ensure critical family name aliases are present:
          cp assets/fonts/Feather.ttf android/app/src/main/assets/fonts/assets_fonts_feather.ttf
          cp assets/fonts/OptimisticApp-Regular.ttf android/app/src/main/assets/fonts/OptimisticApp.ttf
          echo "Verified android/app/src/main/assets/fonts contents:"
          ls -lh android/app/src/main/assets/fonts

      - name: Configure arm64-v8a architecture filter
        run: |
          # Use printf with leading newline so it never appends to the trailing JSON property in gradle.properties
          printf "\nreactNativeArchitectures=arm64-v8a\n" >> android/gradle.properties
          tail -n 10 android/gradle.properties

      - name: Build optimized Release APK (arm64-v8a)
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Locate and prepare release APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found in android/app/build/outputs/apk/release!"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          mkdir -p output
          cp "$APK" output/app-release-arm64.apk
          echo "Final APK Size:"
          ls -lh output/app-release-arm64.apk

      - name: Verify APK contains bundle and fonts
        run: |
          unzip -l output/app-release-arm64.apk | grep "assets/" || true
          unzip -l output/app-release-arm64.apk | grep -q "assets/index.android.bundle" || (echo "ERROR: index.android.bundle NOT in APK" && exit 1)
          unzip -l output/app-release-arm64.apk | grep -q "assets/fonts/assets_fonts_feather.ttf" || (echo "ERROR: assets_fonts_feather.ttf NOT in APK assets/fonts/" && exit 1)
          unzip -l output/app-release-arm64.apk | grep -q "assets/fonts/Feather.ttf" || (echo "ERROR: Feather.ttf NOT in APK assets/fonts/" && exit 1)
          unzip -l output/app-release-arm64.apk | grep -q "assets/fonts/OptimisticApp.ttf" || (echo "ERROR: OptimisticApp.ttf NOT in APK assets/fonts/" && exit 1)
          echo "ALL CHECKS PASSED: Bundle and custom fonts are 100% verified inside assets/fonts/!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-like-app-release-arm64
          path: output/app-release-arm64.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${{ github.run_number }}" output/app-release-arm64.apk \
            --title "Preview build ${{ github.run_number }} (arm64-v8a)" \
            --notes "Optimized Release APK for arm64-v8a (stripped C++ symbols, ABI filtered) built by GitHub Actions." \
            --prerelease
